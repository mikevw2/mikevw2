<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --bg: {{bgColor}}; --accent: {{accentColor}}; --ink: #1f1a17; --paper: #fbf8f3; }
  html, body { margin: 0; padding: 0; width: 1000px; height: 1500px; overflow: hidden; }
  body { background: var(--paper); font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif; color: var(--ink); }
  .half { position: absolute; left: 0; width: 1000px; height: 660px; overflow: hidden; }
  .top { top: 0; }
  .bottom { top: 660px; }
  .half img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .half .placeholder { width: 100%; height: 100%; }
  .top .placeholder { background: linear-gradient(160deg, #9a8f86 0%, #d9d2c9 100%); }
  .bottom .placeholder { background: linear-gradient(160deg, var(--accent) 0%, var(--paper) 100%); }
  .label { position: absolute; left: 80px; top: 80px; font-size: 30px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; padding: 12px 22px; background: rgba(251,248,243,.92); border-radius: 12px; }
  .bottom .label { background: var(--ink); color: var(--paper); }
  .caption { position: absolute; left: 0; top: 1320px; width: 1000px; height: 180px; background: var(--bg); box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .caption .text { font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px; max-width: 640px; }
  .caption .tag { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 12px 20px; background: var(--ink); color: var(--paper); border-radius: 999px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="half top">{{photoBlock}}<div class="label">Before</div></div>
  <div class="half bottom">{{photoBlockAfter}}<div class="label">After</div></div>
  <div class="caption">
    <div class="text">{{headline}}</div>
    <div class="tag">{{keyword}}</div>
  </div>
</body>
</html>
