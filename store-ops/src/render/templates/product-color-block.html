<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* 1000 x 1500 pin. Text-safe margin: 80px all round (Pinterest overlays buttons near the edges). */
  :root { --bg: {{bgColor}}; --accent: {{accentColor}}; --ink: #1f1a17; --paper: #fbf8f3; }
  html, body { margin: 0; padding: 0; width: 1000px; height: 1500px; overflow: hidden; }
  body { background: var(--bg); font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif; color: var(--ink); }
  .safe { position: absolute; inset: 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .headline { font-size: 86px; line-height: 1.02; font-weight: 800; letter-spacing: -1.5px; max-width: 820px; word-wrap: break-word; }
  .photo-wrap { align-self: center; width: 760px; height: 760px; border-radius: 36px; overflow: hidden; background: var(--paper); box-shadow: 0 30px 60px rgba(0,0,0,.18); }
  .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
  .placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, var(--accent) 0%, var(--paper) 100%); display: flex; align-items: flex-end; padding: 32px; box-sizing: border-box; font-size: 28px; color: var(--ink); opacity: .9; }
  .footer { display: flex; justify-content: space-between; align-items: flex-end; }
  .subline { font-size: 34px; font-weight: 500; max-width: 600px; line-height: 1.25; }
  .tag { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 14px 22px; background: var(--ink); color: var(--paper); border-radius: 999px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="safe">
    <div class="headline">{{headline}}</div>
    <div class="photo-wrap">{{photoBlock}}</div>
    <div class="footer">
      <div class="subline">{{subline}}</div>
      <div class="tag">{{keyword}}</div>
    </div>
  </div>
</body>
</html>
